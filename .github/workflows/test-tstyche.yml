name: Test tstyche

on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - run: npm install
      - run: npm run build
        env:
          FORCE_COLOR: true
      - run: npm pack
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ./*.tgz

  coverage:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: tstyche/tstyche
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - run: corepack enable
      - run: yarn install

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact
          path: ./

      - run: yarn add ./monocart-coverage-reports-*.tgz

      - run: yarn test:coverage
        env:
          FORCE_COLOR: true
          MCR_LOG_TIME: true
