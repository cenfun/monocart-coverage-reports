# Simple workflow for deploying static content to GitHub Pages
name: CI

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  documentation:
    runs-on: ubuntu-latest
    name: Documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No browser downloads or runtime bundle builds are needed for documentation.
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: ./.temp/site
          include-hidden-files: true
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    runs-on: ubuntu-latest
    name: Test Node ${{ matrix.node-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: ''
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx puppeteer browsers install chrome
      - run: npm run build
      - run: npm run test
        env:
          FORCE_COLOR: true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.node-version }}
          path: |
            ./.temp/site/reports
            !./.temp/site/reports/**/.cache/**
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, documentation]
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ./.temp/site

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: artifact-22
          path: ./.temp/site/reports

      - name: Generate list using Markdown
        run: |
          cat .temp/site/reports/mcr/coverage-summary.md >> $GITHUB_STEP_SUMMARY
          cat .temp/site/reports/mcr/coverage-details.md >> $GITHUB_STEP_SUMMARY
        
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@master
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./
          args: >
            -Dsonar.organization=cenfun
            -Dsonar.projectKey=monocart-coverage-reports
            -Dsonar.projectName=monocart-coverage-reports
            -Dsonar.javascript.lcov.reportPaths=.temp/site/reports/mcr/lcov.info
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=test/**,dist/**,docs/**,.temp/**,node_modules/**,lib/packages/**,scripts/og-image/**,scripts/test-runtime.js
            -Dsonar.test.exclusions=test/**

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: ./.temp/site/reports/mcr/lcov.info
      
      - name: Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./.temp/site/reports/mcr/lcov.info
      
      - name: Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          disable_search: true
          files: ${{ github.workspace }}/.temp/site/reports/mcr/codecov.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.temp/site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4