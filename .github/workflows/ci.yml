# Build documentation, test the project, publish coverage, and deploy GitHub Pages.
name: CI

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:

  documentation:
    runs-on: ubuntu-latest
    name: Documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # No browser downloads or runtime bundle builds are needed for documentation.
      - run: npm ci --ignore-scripts
      - run: npm run docs
      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: ./.temp/site
          include-hidden-files: true
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.18.0', 22, 24, 26]

    runs-on: ubuntu-latest
    name: Test Node ${{ matrix.node-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: ''
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx puppeteer browsers install chrome
      - run: npm run build
      - run: npm run test
        env:
          FORCE_COLOR: true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.node-version }}
          path: |
            ./.temp/site/reports
            !./.temp/site/reports/**/.cache/**
          include-hidden-files: true
          if-no-files-found: error

  coverage-summary:
    name: Coverage summary
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: artifact-24
          path: ./.temp/site/reports

      - name: Write coverage summary
        run: |
          cat .temp/site/reports/mcr/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat .temp/site/reports/mcr/coverage-details.md >> "$GITHUB_STEP_SUMMARY"

  codecov:
    name: Codecov
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: artifact-24
          path: ./.temp/site/reports

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          disable_search: true
          fail_ci_if_error: true
          files: ${{ github.workspace }}/.temp/site/reports/mcr/codecov.json

  sonarcloud:
    name: SonarQube Cloud
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: artifact-24
          path: ./.temp/site/reports

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./
          args: >
            -Dsonar.organization=cenfun
            -Dsonar.projectKey=monocart-coverage-reports
            -Dsonar.projectName=monocart-coverage-reports
            -Dsonar.javascript.lcov.reportPaths=.temp/site/reports/mcr/lcov.info
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=test/**,dist/**,docs/**,.temp/**,node_modules/**,lib/packages/**,scripts/og-image/**,scripts/test-runtime.js
            -Dsonar.test.exclusions=test/**

  coveralls:
    name: Coveralls
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: artifact-24
          path: ./.temp/site/reports

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./.temp/site/reports/mcr/lcov.info
          format: lcov

  codacy:
    name: Codacy
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: artifact-24
          path: ./.temp/site/reports

      - name: Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./.temp/site/reports/mcr/lcov.info
      
  pages-artifact:
    name: Prepare GitHub Pages artifact
    if: github.ref == 'refs/heads/main'
    needs: [test, documentation]
    runs-on: ubuntu-latest
    steps:
      - name: Download documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: ./.temp/site

      - name: Download Node.js 24 reports
        uses: actions/download-artifact@v8
        with:
          name: artifact-24
          path: ./.temp/site/reports

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './.temp/site'
          include-hidden-files: true

  deploy:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main'
    # The artifact may not be discoverable immediately after upload (actions/deploy-pages#451).
    needs: pages-artifact
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5