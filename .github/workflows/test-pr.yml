name: Test PR

on:

  push:
    branches: ["test-pr-changes"]
    
  pull_request:
    branches: ["test-pr-changes"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ''

      - run: npm install
      - run: npm run build
      - run: npm run test-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: true

      - name: Generate list using Markdown
        run: |
          cat .temp/site/reports/pr/coverage-summary.md >> $GITHUB_STEP_SUMMARY
          cat .temp/site/reports/pr/coverage-details.md >> $GITHUB_STEP_SUMMARY
          
